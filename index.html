    <meta property="og:title" content="منصة البشير التعليمية | مدرسة عبد الملك بن مروان" />
    <meta property="og:description" content="منصة البشير التعليمية - إعداد: صهيب القحطاني، مدرسة عبد الملك بن مروان." />
    <meta property="og:type" content="website" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
      #netlify-badge,
      .netlify-badge,
      [data-netlify-badge],
      footer img[alt*="Netlify"],
      a[href*="netlify.com"],
      [class*="netlify"],
      [id*="netlify"],
      [aria-label*="Netlify"],
      [title*="Netlify"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        height: 0 !important;
        width: 0 !important;
        position: absolute !important;
        z-index: -9999 !important;
      }
    </style>
    <script>
      (function() {
        function removeNetlify() {
          try {
            document.querySelectorAll('a[href*="netlify.com"], [class*="netlify"], [id*="netlify"], [aria-label*="Netlify"]').forEach(function(el) {
              el.remove();
            });
            document.querySelectorAll('div, a, footer, button, span').forEach(function(el) {
              if (el.textContent && el.textContent.trim().includes('Powered by Netlify')) {
                el.remove();
              }
            });
          } catch (e) {}
        }
        if (typeof window !== 'undefined') {
          window.addEventListener('DOMContentLoaded', removeNetlify);
          window.addEventListener('load', removeNetlify);
          var obs = new MutationObserver(removeNetlify);
          obs.observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
